<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Bum</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f2b"/>
      <stop offset="1" stop-color="#06070b"/>
    </linearGradient>
    <radialGradient id="cap" cx="50%" cy="62%" r="62%">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.32" stop-color="#ffc24a"/>
      <stop offset="0.68" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#9c2208"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.55" stop-color="#e2541a"/>
      <stop offset="1" stop-color="#5a1a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff6a1f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff6a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- resplandor en el suelo -->
  <ellipse cx="32" cy="51.5" rx="22" ry="6" fill="url(#glow)"/>
  <!-- columna -->
  <path d="M28.6 33 C28.4 39 27.4 44.5 24.5 50.5 L39.5 50.5 C36.6 44.5 35.6 39 35.4 33 Z" fill="url(#stem)"/>
  <!-- anillo de condensación -->
  <ellipse cx="32" cy="37.2" rx="7.6" ry="1.7" fill="none" stroke="#ffe3b0" stroke-opacity="0.75" stroke-width="1.2"/>
  <!-- sombrero -->
  <g fill="url(#cap)">
    <circle cx="21.5" cy="25.5" r="7.5"/>
    <circle cx="42.5" cy="25.5" r="7.5"/>
    <circle cx="27" cy="19.5" r="8.5"/>
    <circle cx="37" cy="19.5" r="8.5"/>
    <circle cx="32" cy="16" r="8"/>
    <ellipse cx="32" cy="28.5" rx="15.5" ry="5.5"/>
  </g>
  <!-- base del sombrero en sombra -->
  <path d="M16.6 29.5 C21 34.2 43 34.2 47.4 29.5 C43.5 31.6 20.5 31.6 16.6 29.5 Z" fill="#7a1a07" fill-opacity="0.55"/>
  <!-- brillo superior -->
  <ellipse cx="29" cy="14.5" rx="5" ry="2.6" fill="#fffbe8" fill-opacity="0.55"/>
</svg>
